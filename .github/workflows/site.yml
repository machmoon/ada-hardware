# Publish the marketing page in site/ to GitHub Pages on every push to main.
# One static page, no build step (site/README.md), so the job is checkout,
# upload, deploy -- the shape GitHub's own starter workflow uses
# (actions/starter-workflows: pages/static.yml). Enable Pages once in the
# repository settings with "GitHub Actions" as the source; until then this
# job fails at deploy with a message naming that setting.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
