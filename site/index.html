<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ada</title>
    <meta
      name="description"
      content="Ada is the Cursor of hardware engineering: it draws the schematic, proves it with KiCad's own checks, and routes a board you can send to the fab."
    />
    <link rel="icon" href="./assets/icon.png" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <meta property="og:title" content="Ada" />
    <meta
      property="og:description"
      content="The Cursor of hardware engineering. Ada draws the schematic, proves it with KiCad's own checks, and routes a board you can send to the fab."
    />
    <!-- og:image must be absolute (Open Graph). vite.config.ts copies assets/board.png to og/board.png. -->
    <meta property="og:image" content="https://d1l2uamq911fx1.cloudfront.net/og/board.png" />
    <meta property="og:url" content="https://d1l2uamq911fx1.cloudfront.net/" />
    <meta name="theme-color" content="#f8f8f7" />
    <script>
      // Theme before first paint: a saved choice ("ada-theme", the old page's key) or the system setting,
      // followed live while nothing is saved. Without JavaScript the page stays light.
      (function () {
        var root = document.documentElement;
        var media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
        function saved() {
          try {
            var v = localStorage.getItem("ada-theme");
            return v === "light" || v === "dark" ? v : null;
          } catch (e) {
            return null;
          }
        }
        function apply() {
          var s = saved();
          root.dataset.theme = s || (media && media.matches ? "dark" : "light");
        }
        apply();
        if (media && media.addEventListener)
          media.addEventListener("change", function () {
            if (!saved()) apply();
          });
      })();
    </script>
  </head>
  <body>
    <!-- Without JavaScript React draws nothing, so a reader or crawler gets the headline and the three links that
         matter. Keep the words in step with src/content.ts (HERO.title, LINKS, DEMO_MAILTO). -->
    <noscript>
      <main class="mx-auto max-w-[768px] px-4 pt-[20vh] text-center sm:px-6">
        <h1 class="font-serif text-[28px] leading-[42px] font-normal text-[var(--text-primary)] md:text-[36px] md:leading-[54px]">
          Order boards that work.
        </h1>
        <p class="mt-3 text-base leading-6 text-[var(--text-secondary)]">
          Ada is an AI hardware engineer that works beside KiCad. The rest of this page needs JavaScript.
        </p>
        <p class="mt-5 text-sm leading-5 text-[var(--text-primary)]">
          <a class="underline underline-offset-2" href="https://github.com/machmoon/ada-hardware">GitHub</a> ·
          <a class="underline underline-offset-2" href="https://github.com/machmoon/ada-hardware/blob/main/docs/install.md">Install</a> ·
          <a class="underline underline-offset-2" href="mailto:liujpatrick@gmail.com?subject=Ada%20demo">Get a demo</a>
        </p>
      </main>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
